[workspace]
resolver = "3"
members = ["crates/gateworlds-protocol", "crates/gateworlds-validate"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "0BSD"
repository = "https://github.com/titafox/gateworlds"

[workspace.dependencies]
serde_json = "1"
jsonschema = { version = "0.35", default-features = false }
sha2 = "0.10"
